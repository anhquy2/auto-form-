<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Google Form - Hệ thống rải dữ liệu theo tỷ lệ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-800 pb-6 mb-8">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">Auto Google Form Studio by VanQuy</h1>
        <p class="text-slate-400 text-sm mt-1">Quét cấu trúc tự động & phân phối định mức tỷ lệ phần trăm chính xác</p>
      </div>
      <div class="mt-3 md:mt-0 text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg">
        Lưu ý: Tắt <span class="text-amber-400 font-medium">Thu thập email</span> & <span class="text-amber-400 font-medium">Giới hạn 1 lần trả lời</span> trước khi chạy
      </div>
    </div>

    <!-- Bước 1: Nhập Link Form -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-6 shadow-lg">
      <label class="block text-sm font-semibold text-slate-300 mb-2">1. Dán đường link Google Form (Link rút gọn forms.gle hoặc link đầy đủ)</label>
      <div class="flex flex-col sm:flex-row gap-3">
        <input
          id="formUrlInput"
          type="text"
          placeholder="https://docs.google.com/forms/d/e/.../viewform"
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500"
        />
        <button
          id="scanBtn"
          onclick="scanForm()"
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition cursor-pointer"
        >
          Quét câu hỏi
        </button>
      </div>
      <p id="scanError" class="text-rose-400 text-xs mt-2 hidden"></p>
    </div>

    <!-- Khu vực cấu hình sau khi quét thành công -->
    <div id="workspace" class="hidden space-y-6">
      <!-- Thông tin chung & Cấu hình số lượng -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-4 mb-5">
          <div>
            <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">Biểu mẫu đã nhận diện</span>
            <h2 id="formTitleDisplay" class="text-lg font-bold text-white mt-0.5"></h2>
          </div>
          <span id="questionCountBadge" class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full self-start"></span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Tổng số phiếu cần chạy</label>
            <input id="totalInput" type="number" value="10" min="1" max="2000"
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm font-semibold text-emerald-400" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nghỉ tối thiểu giữa 2 phiếu (giây)</label>
            <input id="delayMinInput" type="number" value="1.0" step="0.1" min="0.2"
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nghỉ tối đa giữa 2 phiếu (giây)</label>
            <input id="delayMaxInput" type="number" value="2.5" step="0.1" min="0.5"
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>
      </div>

      <!-- Danh sách câu hỏi & Nhập tỷ lệ -->
      <div class="space-y-4" id="questionsContainer"></div>

      <!-- Thanh điều khiển Chạy & Tiến trình -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 sticky bottom-4 shadow-2xl">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <button
              id="runBtn"
              onclick="startCampaign()"
              class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition cursor-pointer"
            >
              Bắt đầu chạy Auto
            </button>
            <button
              id="stopBtn"
              onclick="stopCampaign()"
              class="hidden bg-rose-600 hover:bg-rose-500 text-white font-semibold px-4 py-2.5 rounded-lg text-sm transition cursor-pointer"
            >
              Dừng lại
            </button>
          </div>
          <div id="statsSummary" class="text-sm font-medium text-slate-300">
            Sẵn sàng chạy
          </div>
        </div>

        <!-- Progress bar -->
        <div id="progressWrapper" class="hidden mt-4">
          <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
            <div id="progressBar" class="bg-emerald-500 h-2.5 transition-all duration-300" style="width: 0%"></div>
          </div>
          <div id="logBox" class="mt-3 bg-slate-950 border border-slate-800 rounded-lg p-3 h-36 overflow-y-auto font-mono text-xs text-slate-300 space-y-1"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let scannedData = null;
    let currentTaskId = null;
    let pollTimer = null;

    async function scanForm() {
      const url = document.getElementById("formUrlInput").value.trim();
      const errEl = document.getElementById("scanError");
      const scanBtn = document.getElementById("scanBtn");

      errEl.classList.add("hidden");
      if (!url) {
        errEl.textContent = "Vui lòng dán đường link Google Form trước khi quét.";
        errEl.classList.remove("hidden");
        return;
      }

      scanBtn.disabled = true;
      scanBtn.textContent = "Đang quét...";

      try {
        const res = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Lỗi khi quét Form");

        scannedData = data;
        renderWorkspace();
      } catch (e) {
        errEl.textContent = "Lỗi: " + e.message;
        errEl.classList.remove("hidden");
      } finally {
        scanBtn.disabled = false;
        scanBtn.textContent = "Quét câu hỏi";
      }
    }

    function renderWorkspace() {
      document.getElementById("workspace").classList.remove("hidden");
      document.getElementById("formTitleDisplay").textContent = scannedData.form_title;
      document.getElementById("questionCountBadge").textContent = `${scannedData.questions.length} câu hỏi`;

      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";

      scannedData.questions.forEach((q, qIdx) => {
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5";

        if (q.kind === "single") {
          card.innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <span class="text-xs font-semibold text-indigo-400">[Chọn 1 đáp án]</span>
                <h3 class="font-semibold text-slate-100 text-sm mt-0.5">${escapeHtml(q.title)}</h3>
              </div>
              <span id="sum-badge-${qIdx}" class="text-xs font-mono px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-300">Tổng: 100%</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
              ${q.options.map((opt, oIdx) => `
                <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-lg px-3 py-2">
                  <span class="text-xs text-slate-300 truncate pr-2" title="${escapeHtml(opt)}">${escapeHtml(opt)}</span>
                  <input type="number" min="0" max="100" value="${q.weights[oIdx]}"
                    oninput="updateSingleWeight(${qIdx}, ${oIdx}, this.value)"
                    class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-right text-xs font-semibold text-white" />
                </div>
              `).join("")}
            </div>
          `;
        } else if (q.kind === "checkbox") {
          card.innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <span class="text-xs font-semibold text-amber-400">[Chọn nhiều - % số phiếu chọn ô này]</span>
                <h3 class="font-semibold text-slate-100 text-sm mt-0.5">${escapeHtml(q.title)}</h3>
              </div>
              <span class="text-xs text-slate-400">Mỗi ô từ 0% đến 100%</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
              ${q.options.map((opt, oIdx) => `
                <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-lg px-3 py-2">
                  <span class="text-xs text-slate-300 truncate pr-2" title="${escapeHtml(opt)}">${escapeHtml(opt)}</span>
                  <input type="number" min="0" max="100" value="${q.weights[oIdx]}"
                    oninput="scannedData.questions[${qIdx}].weights[${oIdx}] = Number(this.value)"
                    class="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-right text-xs font-semibold text-amber-300" />
                </div>
              `).join("")}
            </div>
          `;
        } else if (q.kind === "grid") {
          card.innerHTML = `
            <div class="mb-3">
              <span class="text-xs font-semibold text-purple-400">[Lưới thang đo - Mỗi hàng tổng 100%]</span>
              <h3 class="font-semibold text-slate-100 text-sm mt-0.5">${escapeHtml(q.title)}</h3>
            </div>
            <div class="space-y-3">
              ${q.rows.map((row, rIdx) => `
                <div class="bg-slate-950 border border-slate-800 rounded-lg p-3">
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-medium text-slate-200">${escapeHtml(row.row_label)}</span>
                    <span id="grid-sum-${qIdx}-${rIdx}" class="text-xs font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Tổng: 100%</span>
                  </div>
                  <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                    ${row.options.map((opt, oIdx) => `
                      <div class="flex flex-col bg-slate-900 border border-slate-800 rounded p-2">
                        <span class="text-[11px] text-slate-400 truncate mb-1" title="${escapeHtml(opt)}">${escapeHtml(opt)}</span>
                        <input type="number" min="0" max="100" value="${row.weights[oIdx]}"
                          oninput="updateGridWeight(${qIdx}, ${rIdx}, ${oIdx}, this.value)"
                          class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-right text-xs font-semibold text-white" />
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          `;
        } else if (q.kind === "text") {
          card.innerHTML = `
            <div class="mb-2">
              <span class="text-xs font-semibold text-cyan-400">[Tự luận - Mỗi dòng là 1 câu trả lời mẫu]</span>
              <h3 class="font-semibold text-slate-100 text-sm mt-0.5">${escapeHtml(q.title)}</h3>
            </div>
            <textarea rows="3"
              oninput="scannedData.questions[${qIdx}].samples = this.value.split('\\n')"
              class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs text-slate-200"
            >${q.samples.join("\n")}</textarea>
          `;
        }

        container.appendChild(card);
      });
    }

    function updateSingleWeight(qIdx, oIdx, val) {
      scannedData.questions[qIdx].weights[oIdx] = Number(val) || 0;
      const sum = scannedData.questions[qIdx].weights.reduce((a, b) => a + b, 0);
      const badge = document.getElementById(`sum-badge-${qIdx}`);
      badge.textContent = `Tổng: ${sum}%`;
      badge.className = sum === 100
        ? "text-xs font-mono px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-300"
        : "text-xs font-mono px-2.5 py-1 rounded bg-rose-500/20 text-rose-300";
    }

    function updateGridWeight(qIdx, rIdx, oIdx, val) {
      scannedData.questions[qIdx].rows[rIdx].weights[oIdx] = Number(val) || 0;
      const sum = scannedData.questions[qIdx].rows[rIdx].weights.reduce((a, b) => a + b, 0);
      const badge = document.getElementById(`grid-sum-${qIdx}-${rIdx}`);
      badge.textContent = `Tổng: ${sum}%`;
      badge.className = sum === 100
        ? "text-xs font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300"
        : "text-xs font-mono px-2 py-0.5 rounded bg-rose-500/20 text-rose-300";
    }

    async function startCampaign() {
      const payload = {
        view_url: scannedData.view_url,
        submit_url: scannedData.submit_url,
        page_history: scannedData.page_history,
        total: Number(document.getElementById("totalInput").value) || 10,
        delay_min: Number(document.getElementById("delayMinInput").value) || 1.0,
        delay_max: Number(document.getElementById("delayMaxInput").value) || 2.5,
        questions: scannedData.questions
      };

      document.getElementById("runBtn").disabled = true;
      document.getElementById("stopBtn").classList.remove("hidden");
      document.getElementById("progressWrapper").classList.remove("hidden");

      const res = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      currentTaskId = data.task_id;

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollStatus, 1200);
    }

    async function stopCampaign() {
      if (!currentTaskId) return;
      await fetch(`/api/stop/${currentTaskId}`, { method: "POST" });
    }

    async function pollStatus() {
      if (!currentTaskId) return;
      const res = await fetch(`/api/status/${currentTaskId}`);
      const st = await res.json();

      const pct = Math.round((st.sent / st.total) * 100);
      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("statsSummary").textContent =
        `Tiến độ: ${st.sent}/${st.total} phiếu (Thành công: ${st.success} | Lỗi: ${st.failed})`;

      const logBox = document.getElementById("logBox");
      logBox.innerHTML = st.logs.map(line => `<div>${escapeHtml(line)}</div>`).join("");
      logBox.scrollTop = logBox.scrollHeight;

      if (st.status !== "running") {
        clearInterval(pollTimer);
        document.getElementById("runBtn").disabled = false;
        document.getElementById("stopBtn").classList.add("hidden");
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
